name: CI

# Every push to main and every pull request: typecheck -> lint -> unit tests -> build -> end-to-end.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm # keyed by package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and property tests (Vitest)
        run: npm test

      - name: Build the client
        run: npm run build

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (Playwright, two browsers)
        run: npm run e2e

      - name: Keep the Playwright report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
