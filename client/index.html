<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dogfight — Lab 03</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05060a;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #lobby {
        position: fixed;
        inset: 0;
        margin: auto;
        width: min(460px, 90vw);
        height: fit-content;
        padding: 20px 24px;
        background: rgba(10, 14, 24, 0.92);
        border: 1px solid #2b3a58;
        border-radius: 8px;
        color: #e8f1ff;
        font:
          14px ui-monospace,
          Consolas,
          monospace;
      }
      #lobby[hidden] {
        display: none;
      }
      #lobby h1 {
        margin: 0 0 12px;
        font-size: 20px;
      }
      #lobby ul {
        list-style: none;
        margin: 8px 0 0;
        padding: 0;
      }
      #lobby li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 0;
        border-top: 1px solid #1c2740;
      }
      #lobby .status {
        color: #9dffb0;
        margin: 10px 0 0;
      }
      #lobby .status.error {
        color: #ff6a6a;
      }
      #lobby .create {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      #lobby .create input {
        flex: 1;
      }
      #chat {
        position: fixed;
        left: 12px;
        bottom: 12px;
        width: min(360px, 70vw);
        color: #e8f1ff;
        font:
          13px ui-monospace,
          Consolas,
          monospace;
      }
      #netui {
        position: fixed;
        right: 12px;
        bottom: 12px;
        width: 300px;
        padding: 8px 10px;
        background: rgba(10, 14, 24, 0.85);
        border: 1px solid #2b3a58;
        border-radius: 6px;
        color: #e8f1ff;
        font:
          12px ui-monospace,
          Consolas,
          monospace;
      }
      #netui[hidden] {
        display: none;
      }
      #netui label {
        display: block;
        margin: 4px 0;
      }
      #netui input[type="range"] {
        display: block;
        width: 100%;
      }
      #chat[hidden] {
        display: none;
      }
      #chat .roster {
        color: #9dffb0;
        margin-bottom: 4px;
      }
      #chat .log {
        max-height: 140px;
        overflow-y: auto;
        text-shadow: 0 1px 2px #000;
      }
      #chat .log .sys {
        color: #6b7790;
      }
      #chat input {
        width: 100%;
        box-sizing: border-box;
        margin-top: 4px;
        background: rgba(10, 14, 24, 0.7);
        color: inherit;
        border: 1px solid #2b3a58;
        padding: 4px 6px;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="lobby" hidden></div>
    <div id="chat" hidden></div>
    <div id="netui" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
